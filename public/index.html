<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murmur</title>
<style>
:root{--bg:#0f1115;--panel:#161922;--line:#262b38;--fg:#e6e8ee;--dim:#8b92a5;--accent:#6ee7b7;--mine:#1d3a30}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ec;--fg:#14161c;--dim:#6b7285;--accent:#059669;--mine:#d9f3e8}}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
aside h1{font-size:15px;margin:0;padding:16px}aside h1 small{display:block;color:var(--dim);font-weight:400;font-size:12px}
#groups{flex:1;overflow:auto}.g{padding:10px 16px;cursor:pointer;border-left:3px solid transparent}.g:hover{background:var(--bg)}
.g.on{border-color:var(--accent);background:var(--bg)}.g b{display:block}.g span{color:var(--dim);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:5px}.dot.live{background:var(--accent)}
.tools{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer;background:var(--accent);color:#04251a;border:0;font-weight:600}button.ghost{background:none;color:var(--dim);border:1px solid var(--line);font-weight:400}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}
header code{font-size:12px;color:var(--dim);word-break:break-all}
#msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(560px,80%);padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.m.mine{align-self:flex-end;background:var(--mine);border-color:transparent}.m small{display:block;color:var(--dim);font-size:11px}
form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}form input{flex:1}
.empty{margin:auto;color:var(--dim);text-align:center;max-width:380px}
@media(max-width:640px){aside{width:100%;position:absolute;inset:0 0 auto 0;height:42vh;z-index:1}main{margin-top:42vh}}
</style></head><body>
<aside>
  <h1>Murmur<small id="me"></small></h1>
  <div id="groups"></div>
  <div class="tools">
    <input id="newName" placeholder="New group name">
    <button id="create">Create group</button>
    <input id="joinId" placeholder="Paste group id (grp_…)">
    <button class="ghost" id="join">Join group</button>
  </div>
</aside>
<main>
  <header><div><b id="title">No group selected</b><br><code id="gid"></code></div><button class="ghost" id="copy" hidden>Copy id</button></header>
  <div id="msgs"><div class="empty">Create a group, then send its id to friends. Everyone who has the id holds a full copy of the chat, no server involved.</div></div>
  <form id="f" hidden><input id="text" placeholder="Message…" autocomplete="off"><button>Send</button></form>
</main>
<script>
const $ = (id) => document.getElementById(id)
let cur = localStorage.getItem('cur'), groups = []
const api = (p, body) => fetch('/api/' + p, body ? { method: 'POST', body: JSON.stringify(body) } : {}).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j })
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

async function refresh() {
  const s = await api('state'); groups = s.groups
  $('me').textContent = s.me.name + ' · ' + s.me.id.slice(0, 8)
  if (!groups.find((g) => g.id === cur)) cur = groups[0]?.id || null
  $('groups').innerHTML = groups.map((g) => `<div class="g ${g.id === cur ? 'on' : ''}" data-id="${g.id}"><b>${esc(g.label)}</b><span><i class="dot ${g.peers ? 'live' : ''}"></i>${g.peers} peer${g.peers == 1 ? '' : 's'} online · ${g.count} msgs</span></div>`).join('')
  const g = groups.find((x) => x.id === cur)
  $('title').textContent = g ? g.label : 'No group selected'; $('gid').textContent = g ? g.id : ''
  $('copy').hidden = $('f').hidden = !g
  if (!g) return
  const ms = await api('messages?g=' + cur), box = $('msgs'), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80
  box.innerHTML = ms.length ? ms.map((m) => `<div class="m ${m.mine ? 'mine' : ''}"><small>${esc(m.name)} · ${new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</small>${esc(m.text)}</div>`).join('') : '<div class="empty">No messages yet.</div>'
  if (atEnd) box.scrollTop = box.scrollHeight
}
$('groups').onclick = (e) => { const el = e.target.closest('.g'); if (el) { cur = el.dataset.id; localStorage.setItem('cur', cur); refresh() } }
$('create').onclick = async () => { const r = await api('create', { label: $('newName').value }); $('newName').value = ''; cur = r.id; refresh() }
$('join').onclick = async () => { try { const r = await api('join', { id: $('joinId').value, label: 'joined group' }); $('joinId').value = ''; cur = r.id; refresh() } catch (e) { alert(e.message) } }
$('copy').onclick = () => navigator.clipboard.writeText(cur)
$('f').onsubmit = async (e) => { e.preventDefault(); const t = $('text').value; if (!t.trim()) return; $('text').value = ''; await api('send', { g: cur, text: t }) }
new EventSource('/api/events').onmessage = () => refresh()
refresh()
</script></body></html>
